packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
  # SEN-25: the Envio HyperIndex in services/indexer is deliberately NOT a
  # workspace member. `envio` vendors its own runtime (tsx loader, pino,
  # postgres, viem) and runs `envio dev` against a Docker Postgres+Hasura —
  # nothing it does belongs in root typecheck/lint/test, and a hoisted
  # workspace install would fight its pinned toolchain. Verified with pnpm
  # 12.3.4: the negative glob drops it from the project graph. It has its
  # own package.json; run `npm install` inside it (see docs/indexer.md).
  - '!services/indexer'
# Native postinstall builds we explicitly trust.
#   @parcel/watcher  — file watching for `nest start --watch` and Metro
#   unrs-resolver    — native resolver used by the eslint toolchain
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
  - '@anthropic-ai/sdk@0.125.0'

# Metro cannot resolve the isolated (symlinked) layout — CLAUDE.md gotcha 1.
# pnpm 12 ignores node-linker in .npmrc, so the setting has to live here.
nodeLinker: hoisted
