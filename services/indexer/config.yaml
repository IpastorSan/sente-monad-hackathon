# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Sente leaderboard indexer — Monad testnet (10143). Kuru Spot V2 fills only.
#
# Kuru fills come off the four market OrderBook proxies as packed
# `TradesPacked` events, decoded by hand in src/lib/packed.ts because the
# payload is bit-packed, not ABI-encoded. Account custody flows and the
# id -> address mapping come off AccountCore.
#
# Kuru-only on purpose (SEN-171): Envio Cloud's free Development plan stops at
# 100,000 processed events, and Perpl's Exchange alone emits ~216k an hour.
# Kuru's `BookUpdatesPacked` and AccountCore's `SpotReserveUpdated` are left
# out for the same reason — the leaderboard reads neither. The numbers, and
# the estimate that sizes `start_block` below, are in docs/indexer.md §budget.
#
# Every signature below was checked against the chain, not just against a
# vendored ABI: `scripts/verify-config-topics.ts` recomputes each topic0 from
# the string here and greps recent logs for the configured addresses. A wrong
# signature fails loudly (zero logs) rather than silently, and a wrong `indexed`
# flag is caught by the topic-count check, since decoding depends on it.
#
# Addresses are the Set-C Spot V2 deployment — the table in
# packages/venues/src/kuru/constants.ts is the source of truth; this file is
# a copy for a standalone runtime that cannot import workspace TS.
name: sente-kuru-indexer
description: Kuru Spot V2 fills on Monad testnet, per-account stats for the Sente leaderboard

# Handlers are auto-loaded from ./src (recursively, excluding *.test.ts);
# registration lives in src/handlers/, re-exported by src/EventHandlers.ts,
# pure logic in src/lib/.
handlers: ./src

# Trade rows carry the tx hash, so select it globally (block
# number/timestamp/hash are on by default).
field_selection:
  transaction_fields:
    - hash

chains:
  - id: 10143 # Monad Testnet
    # 2026-10-02T00:00:00Z (binary searched on-chain), 7 days before the
    # 2026-10-09 redeploy. Sized against the 100k-event cap, not chosen for
    # history: see docs/indexer.md §budget before moving it earlier.
    start_block: 67394632
    hypersync_config:
      # HyperSync is the primary source because Monad's public RPC caps
      # eth_getLogs at 100 blocks (docs/monad-testnet-assets.md), which is far
      # too slow for a 7-day backfill. It needs ENVIO_API_TOKEN; without one
      # Envio still builds the source, gets a 401, and then falls back to the
      # RPC below — which is how the handlers were proven against real blocks
      # (docs/indexer.md §hypersync).
      url: https://monad-testnet.hypersync.xyz
    rpc:
      - url: https://testnet-rpc.monad.xyz
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: KuruOrderBook
        address:
          - '0xfdbE356828c8f5A5d5ed4f69ddE0816f4058Ef61' # MON-USDC
          - '0xa9C2936656a7D2143720BcD91Ba8506200B7CbE7' # WETH-USDC
          - '0x5BDEA6F9F9abA34F4EcB9B865646A792b835ef7f' # cbBTC-USDC
          - '0x0B4dD2A7b09d5c5401149fFe51301Cc589017343' # XAUt-USDC
      - name: KuruAccountCore
        address: '0x6384e9b2Bf3b65e1535403a0A543b5FDA905eE22'

contracts:
  - name: KuruOrderBook
    events:
      # Signature copied from @toxicflow-labs/ts-sdk's spotOrderBookAbi so the
      # topic0 hash cannot drift from what the contract emits.
      - event: 'TradesPacked(uint40 indexed accountId, address indexed executor, bytes32 clientOrderId, uint24 effectiveTakerFeePps, address builder, uint24 builderFeePps, bytes packedTrades)'

  - name: KuruAccountCore
    events:
      - event: 'Deposit(uint40 indexed accountId, address indexed token, address indexed payer, uint256 amount)'
      - event: 'Withdrawal(uint40 indexed accountId, address indexed token, address indexed recipient, uint256 amount)'
      # account id -> account address. Without it every leaderboard row is a
      # number nobody can pay.
      - event: 'AccountRegistered(address indexed account, uint40 indexed accountId, uint40 indexed rootAccountId, address owner, uint16 subaccountSeq)'
