"""
Sente leaderboard schema — Monad testnet (10143), Kuru Spot V2 fills.

Kuru only (SEN-171): Perpl's event volume does not fit Envio Cloud's
100k-event Development plan — see docs/indexer.md §budget. `Venue` and the
`kuru-` id prefix stay so the API's reads do not change shape.

Design notes:
- Kuru identities are `uint40` account ids inside AccountCore, not addresses.
  `Account.id` is therefore `"kuru-<id>"`, and its address is read off
  AccountCore the first time the account is seen (most registration events
  are older than the indexed range — see docs/indexer.md §addresses).
- Money is stored as the venue's raw integer units wherever arithmetic happens
  (FIFO-style realised PnL is exact BigInt); `*Usd`/`price` conveniences are
  BigDecimal derived at write time. No float ever touches a raw value.
- Every aggregate is written incrementally by handlers; the leaderboard sorts
  on stored fields, never computes at query time.
- Token and address keys are lowercase for cross-source joins.
"""
enum Side {
  BUY
  SELL
}

enum Venue {
  KURU
}

"""
A Kuru AccountCore trading account (uint40 id). The address is resolved from
AccountCore on first sight and confirmed by AccountRegistered when one lands
inside the indexed range; it is null only for an id AccountCore itself does
not know, and then the leaderboard shows the raw account id.
"""
type Account {
  # "kuru-62"
  id: ID!
  venue: Venue!
  # Numeric account id exactly as emitted on-chain.
  accountId: BigInt!
  # The account address (lowercase): `AccountRegistered.account`, or — when
  # that one-shot event is older than the indexed range, which is the common
  # case — `AccountCore.userAddressById`, read once per account. This is the address that
  # trades and the one a Sente user is matched on, so a null here is an account
  # the leaderboard cannot show at all. See docs/indexer.md §addresses.
  address: String
  # Owner AccountCore names separately (`AccountRegistered.owner`); null until
  # that event is seen. Not inferred from `address`.
  owner: String
  firstSeenBlock: BigInt!
  firstSeenAt: Timestamp!
  # Custody flows (AccountCore Deposit/Withdrawal).
  balances: [AccountBalance!]! @derivedFrom(field: "account")
  # Leaderboard rows, one per market traded.
  marketStats: [AccountMarketStats!]! @derivedFrom(field: "account")
  tradesAsTaker: [Trade!]! @derivedFrom(field: "taker")
  tradesAsMaker: [Trade!]! @derivedFrom(field: "maker")
  # Cross-market rollup kept in sync with the stats rows.
  totalTradeCount: Int!
  totalVolumeUsd: BigDecimal!
  realizedPnlUsd: BigDecimal!
  winningTradeCount: Int!
  losingTradeCount: Int!
}

"""
An account's custody flow for one token: the cumulative movement between
wallet and AccountCore. It knows nothing about what the venue did internally
(fills, fees), so `net` is NOT a balance — it is the capital the account put
in and has not taken out, which is what the leaderboard's ROI divides by.

The absolute balance (`SpotReserveUpdated`) is not indexed: it is emitted on
every fill and custody change, ~29k a day, and the leaderboard never read it
(docs/indexer.md §budget).
"""
type AccountBalance {
  # "<accountId>-<tokenAddress>" (lowercase)
  id: ID!
  account: Account!
  token: String!
  # Raw token units (ERC-20 native decimals; native MON = zero address, 18).
  deposited: BigInt!
  withdrawn: BigInt!
  net: BigInt!
  decimals: Int!
  lastUpdatedBlock: BigInt!
}

"""
One matched trade: one row per record unpacked from a `TradesPacked` log,
with the taker (the event's indexed account) and the maker (inside the
record) both resolved.
"""
type Trade {
  # "<chainId>-<blockNumber>-<logIndex>-<recordIndex>"
  id: ID!
  venue: Venue!
  market: Market!
  # BUY = taker bought base; SELL = taker sold base.
  side: Side!
  # Raw book units as emitted (see Market precisions).
  rawPrice: BigInt!
  rawSize: BigInt!
  # Human-readable price and quote notional, derived at write time.
  price: BigDecimal!
  notionalUsd: BigDecimal!
  # The resting account whose order was hit.
  maker: Account
  # The aggressing account. Always set.
  taker: Account!
  # Fees in quote atoms, from the taker's and maker's pps (per ten million).
  takerFeeRaw: BigInt!
  makerFeeRaw: BigInt!
  blockNumber: BigInt!
  timestamp: Timestamp!
  txHash: String!
  logIndex: Int!
}

"""
A Kuru market, one per OrderBook proxy, seeded in src/lib/seeds.ts from
packages/venues/src/kuru/constants.ts.
"""
type Market {
  # "kuru-<orderBookAddress>" (lowercase)
  id: ID!
  venue: Venue!
  # "MON-USDC"
  symbol: String!
  base: String!
  quote: String!
  # Book price units per 1 quote-per-base.
  pricePrecision: BigInt!
  # Book size units per 1 base.
  sizePrecision: BigInt!
  baseDecimals: Int!
  quoteDecimals: Int!
  # The OrderBook proxy address (lowercase) emitting this market.
  address: String
  tradeCount: Int!
  volumeUsd: BigDecimal!
  latestTradeBlock: BigInt
  daily: [MarketDay!]! @derivedFrom(field: "market")
}

"""
One UTC calendar day per market (`day = floor(blockTimestamp / 86400)`).
"""
type MarketDay {
  # "<marketId>-<yyyymmdd>"
  id: ID!
  market: Market!
  day: Int!
  date: Timestamp!
  tradeCount: Int!
  buyCount: Int!
  sellCount: Int!
  volumeUsd: BigDecimal!
  baseVolume: BigDecimal!
  highPrice: BigDecimal
  lowPrice: BigDecimal
  # volumeUsd / baseVolume — quote per base over the day.
  vwapPrice: BigDecimal
  activeAccountIds: [String!]!
}

"""
The leaderboard row: one per (account, market). Realised PnL uses a signed
moving-average cost basis (exact BigInt quote atoms, floored): trades that
add to the position extend it at the traded price; trades that reduce it
realise (price − avgCost) × closed for a long and (avgCost − price) × closed
for a short. `wins`/`losses` count each reducing trade by the sign of the
realised delta it produced, so a flip (reduce + reopen) counts once.
"""
type AccountMarketStats {
  # "<accountId>-<marketId>"
  id: ID!
  account: Account!
  market: Market!
  # Fills attributed to this account (as taker or maker).
  n: Int!
  takerN: Int!
  makerN: Int!
  volumeUsd: BigDecimal!
  boughtBase: BigDecimal!
  soldBase: BigDecimal!
  # Quote units (USDC, 6dp).
  realizedPnlUsd: BigDecimal!
  wins: Int!
  losses: Int!
  # Position carried into the next trade. openBaseRaw is signed base units;
  # openCostRaw is its signed cost in quote atoms. avgCost = cost/base.
  openBaseRaw: BigInt!
  openCostRaw: BigInt!
  firstTradeBlock: BigInt!
  lastTradeBlock: BigInt!
}
