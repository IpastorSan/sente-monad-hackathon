# Pinned to the patch, not the major. A floating major means CI and this
# machine can install different npm versions, and they then disagree about how
# to resolve a floating peer dependency — which is exactly how the indexer
# lockfile became uninstallable in CI while passing here.
[tools]
java = "temurin-21"
node = "26.10.0"
pnpm = "12.3.4"

[env]
# Android SDK. Set ANDROID_HOME yourself (in your shell, or in a gitignored
# `mise.local.toml`) and that wins; otherwise this assumes the no-root, no-AUR
# install location, $HOME/Android/Sdk. Scoped to this project either way, so it
# never leaks into the rest of ~/Work.
#
# JDK 21 above is load-bearing and not a preference: Java 26's JNI restriction
# breaks the CMake configure step of the dev-client build (CLAUDE.md, gotcha 5).
ANDROID_HOME = "{{ env.ANDROID_HOME | default(value = env.HOME ~ '/Android/Sdk') }}"
ANDROID_SDK_ROOT = "{{ env.ANDROID_HOME | default(value = env.HOME ~ '/Android/Sdk') }}"
_.path = [
  "{{ env.ANDROID_HOME | default(value = env.HOME ~ '/Android/Sdk') }}/platform-tools",
  "{{ env.ANDROID_HOME | default(value = env.HOME ~ '/Android/Sdk') }}/cmdline-tools/latest/bin",
]
